version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tci_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_local
      MYSQL_USER: tci_user
      MYSQL_PASSWORD: tci_password_local
    ports:
      - "3307:3306"
    volumes:
      - tci_mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tci_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    container_name: tci_gateway
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_PORT=8000
      - IDENTITY_SERVICE_URL=http://identity-service:8001
      - USER_SERVICE_URL=http://user-service:8002
      - TAXONOMY_SERVICE_URL=http://taxonomy-service:8003
      - CONTENT_SERVICE_URL=http://content-service:8004
      - PAGE_BUILDER_SERVICE_URL=http://page-builder-service:8005
      - MEDIA_SERVICE_URL=http://media-service:8006
      - CONTACT_SERVICE_URL=http://contact-service:8007
    depends_on:
      - identity-service
      - user-service
      - taxonomy-service
      - content-service
      - page-builder-service
      - media-service
      - contact-service
    networks:
      - tci_network

  identity-service:
    build:
      context: .
      dockerfile: ./services/identity-service/Dockerfile
    container_name: tci_identity_service
    environment:
      - SERVICE_PORT=8001
      - DATABASE_URL=mysql+aiomysql://root:root_password_local@mysql:3306/u738606952_theconclusive?charset=utf8mb4
      - JWT_SECRET_KEY=theconclusiveindian-dev-secret-key-change-in-production-2026
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tci_network

  user-service:
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
    container_name: tci_user_service
    environment:
      - SERVICE_PORT=8002
      - DATABASE_URL=mysql+aiomysql://root:root_password_local@mysql:3306/u738606952_theconclusive?charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tci_network

  taxonomy-service:
    build:
      context: .
      dockerfile: ./services/taxonomy-service/Dockerfile
    container_name: tci_taxonomy_service
    environment:
      - SERVICE_PORT=8003
      - DATABASE_URL=mysql+aiomysql://root:root_password_local@mysql:3306/u738606952_theconclusive?charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tci_network

  content-service:
    build:
      context: .
      dockerfile: ./services/content-service/Dockerfile
    container_name: tci_content_service
    environment:
      - SERVICE_PORT=8004
      - DATABASE_URL=mysql+aiomysql://root:root_password_local@mysql:3306/u738606952_theconclusive?charset=utf8mb4
      - TAXONOMY_SERVICE_URL=http://taxonomy-service:8003
      - USER_SERVICE_URL=http://user-service:8002
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tci_network

  page-builder-service:
    build:
      context: .
      dockerfile: ./services/page-builder-service/Dockerfile
    container_name: tci_page_builder_service
    environment:
      - SERVICE_PORT=8005
      - DATABASE_URL=mysql+aiomysql://root:root_password_local@mysql:3306/u738606952_theconclusive?charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tci_network

  media-service:
    build:
      context: .
      dockerfile: ./services/media-service/Dockerfile
    container_name: tci_media_service
    environment:
      - SERVICE_PORT=8006
      - DATABASE_URL=mysql+aiomysql://root:root_password_local@mysql:3306/u738606952_theconclusive?charset=utf8mb4
      - MEDIA_UPLOAD_DIR=/app/uploads
    volumes:
      - tci_media_storage:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tci_network

  contact-service:
    build:
      context: .
      dockerfile: ./services/contact-moderation-service/Dockerfile
    container_name: tci_contact_service
    environment:
      - SERVICE_PORT=8007
      - DATABASE_URL=mysql+aiomysql://root:root_password_local@mysql:3306/u738606952_theconclusive?charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tci_network

volumes:
  tci_mysql_data:
  tci_media_storage:

networks:
  tci_network:
    driver: bridge
